<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D24"/>
      <stop offset="50%" stop-color="#060818"/>
      <stop offset="100%" stop-color="#040510"/>
    </linearGradient>
    <linearGradient id="neonIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon/squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="4"/>
  
  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#neonIndigo)" stroke-width="2" opacity="0.25" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neonViolet)" stroke-width="1.5" opacity="0.3" />

  <!-- Monogram HE Graphic -->
  <g filter="url(#glow)">
    <!-- Letter H -->
    <path d="M 120 140 L 165 140 L 165 230 L 235 230 L 235 140 L 280 140 L 280 372 L 235 372 L 235 275 L 165 275 L 165 372 L 120 372 Z" 
          fill="url(#neonIndigo)" />
    
    <!-- Letter E -->
    <path d="M 295 140 L 395 140 L 395 185 L 340 185 L 340 230 L 385 230 L 385 275 L 340 275 L 340 327 L 395 327 L 395 372 L 295 372 Z" 
          fill="url(#neonViolet)" />
          
    <!-- Accent Dot / Period -->
    <circle cx="418" cy="358" r="14" fill="url(#neonCyan)" />
  </g>

  <!-- Inner sharp top layer for 3D bevel clarity -->
  <!-- H Highlight -->
  <path d="M 120 140 L 165 140 L 165 230 L 235 230 L 235 140 L 280 140 L 280 372 L 235 372 L 235 275 L 165 275 L 165 372 L 120 372 Z" 
        fill="url(#neonIndigo)" opacity="0.95" />
  <!-- E Highlight -->
  <path d="M 295 140 L 395 140 L 395 185 L 340 185 L 340 230 L 385 230 L 385 275 L 340 275 L 340 327 L 395 327 L 395 372 L 295 372 Z" 
        fill="url(#neonViolet)" opacity="0.95" />
  <!-- Dot -->
  <circle cx="418" cy="358" r="14" fill="#38BDF8" />
  <circle cx="418" cy="358" r="7" fill="#FFFFFF" />

  <!-- Subtle corner accents -->
  <path d="M 60 100 L 60 60 L 100 60" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 452 412 L 452 452 L 412 452" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
